# Machine-readable risk parameters.
# Values are populated ONLY when explicitly validated (see CONSTITUTION.md).
# Unknown/unresolved parameters use `value: null` with explicit `status` metadata.
# Never replace an unknown value with an estimate, convention, or guess.

account:
  reference_capital:
    value: 1000
    currency: EUR
    status: LOCKED
  max_simultaneous_positions:
    value: 2
    status: LOCKED

risk_rules:
  R1_max_risk_per_position:
    value: 50
    currency: EUR
    status: LOCKED
  R2_max_aggregate_open_risk:
    value: 100
    currency: EUR
    status: LOCKED
  R3_max_realized_loss_rolling_window:
    value: 100
    currency: EUR
    window_days: 14
    note: "Loss events recorded at realization/closure. Gains do not net against losses for R3."
    status: LOCKED
  R4_circuit_breaker:
    threshold_drawdown_from_hwm:
      value: 150
      currency: EUR
      status: LOCKED
    high_water_mark_definition:
      value: "historical maximum observed account equity (realized PnL + unrealized PnL)"
      status: LOCKED
    trigger_actions:
      value:
        - "block all new entries"
        - "block all scaling-in/additional entries"
        - "require immediate reanalysis of every currently open position"
      status: LOCKED
    automatic_liquidation_on_threshold:
      value: false
      status: LOCKED
      note: "R4 does not automatically liquidate existing positions. Each open position is re-evaluated against its own thesis and invalidation criteria. No second liquidation threshold exists."

economic_gate:
  basis: "evaluated against current R_max (CONSTITUTION.md §3a); recalculated immediately before execution"
  minimum:
    net_potential:
      value: 200
      currency: EUR
      basis: net
      status: LOCKED
    net_r_multiple:
      value: 4
      unit: R
      status: LOCKED
    note: "Both conditions mandatory."
  preferred:
    net_potential:
      value: 300
      currency: EUR
      basis: net
      status: LOCKED
    net_r_multiple:
      value: 6
      unit: R
      status: LOCKED
    note: "Preference criteria, not permission to violate a hard gate. Hard Gates > Score > Preference."
  implementation:
    value: null
    status: NON_OPERATIONAL
    note: "Strategic thresholds are LOCKED (see minimum/preferred above); the Risk Engine evaluation code implementing this gate is not yet built."

r_max:
  definition:
    value: "maximum currently executable planned monetary risk for the trade after applying all relevant hard constraints"
    status: LOCKED
  dependencies:
    R1: LOCKED
    remaining_R2_capacity: LOCKED
    cluster_correlation_constraints:
      value: null
      status: TO_CALIBRATE
    contractual_instrument_constraints:
      value: null
      status: EXTERNAL_DATA_REQUIRED
    minimum_trade_size:
      value: null
      status: EXTERNAL_DATA_REQUIRED
    margin_constraints:
      value: null
      status: EXTERNAL_DATA_REQUIRED
    execution_constraints:
      value: null
      status: EXTERNAL_DATA_REQUIRED
  no_r_max_definable_outcome:
    value: "NO_TRADE"
    status: LOCKED

risk_scaling:
  automatic_increase_with_capital_growth:
    value: false
    status: LOCKED
  risk_scale_review_protocol:
    value: null
    status: NON_OPERATIONAL
    note: "Any future increase of risk limits requires a documented RISK_SCALE_REVIEW. Protocol not yet specified; must not be invented."

strategy_b:
  holding_horizon_days:
    min: 15
    max: 35
    status: LOCKED

vantage_broker_specification:
  value: null
  status: EXTERNAL_DATA_REQUIRED
  note: "See EXTERNAL_DATA.md for the full list of required fields."
